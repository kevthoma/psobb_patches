name: build

# Builds the PSOBB patches from source on a Windows runner (VS2022 + MSVC + Win10 SDK
# are preinstalled). The widescreen wrapper is 32-bit (PSOBB is x86), output d3d8.dll.
# Artifacts are downloadable from each run's summary page.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  widescreen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # The .fx effects are compiled at RUNTIME by D3DX (so a bad shader only fails in-game).
      # Validate them here with fxc so HLSL errors fail the build instead. CelShader is a
      # known-good control; Sharpen is ours. (Each guards PIXEL_SIZE with an #ifndef fallback.)
      - name: Validate HLSL effects (fxc)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction Stop |
                 Sort-Object FullName | Select-Object -Last 1
          Write-Host "fxc: $($fxc.FullName)"
          foreach ($f in @("CelShader.fx","Sharpen.fx")) {
            Write-Host "--- fxc $f ---"
            & $fxc.FullName /nologo /Tfx_2_0 "psobb_widescreen\res\$f" /Fo "$env:TEMP\$f.fxo"
            if ($LASTEXITCODE -ne 0) { throw "fxc validation failed for $f" }
          }

      # The vcxproj pins WindowsTargetPlatformVersion=7.0 (legacy) and has a post-build
      # step that copies to a local absolute path — override both for CI. D3DX9 headers/
      # libs are vendored in source/dxsdk; d3d9.h/.lib come from the runner's Win10 SDK,
      # so no DirectX SDK install is needed (DXSDK_DIR can stay empty).
      - name: Build psobb_widescreen (Release|Win32)
        # The vcxproj only selects v143 for VisualStudioVersion==17.0; the runner is now
        # VS18, so it falls back to the default v141 (not installed) -> pin the toolset here.
        run: >
          msbuild psobb_widescreen\d3d8to9.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /p:PostBuildEventUseInBuild=false
          /m /v:minimal

      - name: Show build output
        run: dir psobb_widescreen\bin\Release

      - name: Upload d3d8.dll (+ symbols)
        uses: actions/upload-artifact@v7
        with:
          name: d3d8-widescreen-Release-Win32
          path: |
            psobb_widescreen/bin/Release/d3d8.dll
            psobb_widescreen/bin/Release/d3d8.pdb
            psobb_widescreen/bin/Release/d3d8.map
          if-no-files-found: error

  dsound:
    # Proxy dsound.dll for the player volume control. PSOBB imports exactly one function from
    # dsound.dll -- ordinal #1, DirectSoundCreate -- so a proxy owns the whole audio path with no
    # game reverse engineering. 32-bit, same as the client.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build psobb_dsound (Release|Win32)
        # Same toolset pin as the widescreen job: the runner's VS is newer than the version the
        # vcxproj selects for, so name v143 explicitly rather than falling back to an absent v141.
        run: >
          msbuild psobb_dsound\msvc\psobb_dsound.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /m /v:minimal

      - name: Show build output
        run: dir psobb_dsound\bin

      # The load-bearing invariant of this whole DLL. The game resolves DirectSoundCreate by
      # ORDINAL, so if the .def ever drifts from the system DLL's ordinal layout the import goes
      # unresolved and the client fails to start -- with no compile error to warn anyone. Diff the
      # built export table against the runner's own 32-bit dsound.dll and fail the build instead.
      - name: Verify the export ordinals match the system dsound.dll
        run: python tools\pe_exports.py check psobb_dsound\bin\dsound.dll $env:WINDIR\SysWOW64\dsound.dll
        shell: pwsh

      - name: Upload dsound.dll (+ symbols)
        uses: actions/upload-artifact@v7
        with:
          name: dsound-proxy-Release-Win32
          path: |
            psobb_dsound/bin/dsound.dll
            psobb_dsound/bin/dsound.pdb
          if-no-files-found: error

  launcher:
    # Corellia launcher + options app (WinForms, .NET Framework 4.8 -> no runtime install
    # for players). Writes the wrapper's widescreen.cfg; replaces the old .vbs/.ps1 launcher.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Corellia launcher (Release, net48)
        run: dotnet build corellia_launcher/CorelliaLauncher.csproj -c Release -o corellia_launcher/out

      - name: Show build output
        run: dir corellia_launcher\out

      - name: Upload Corellia.exe
        uses: actions/upload-artifact@v7
        with:
          name: Corellia-launcher
          path: corellia_launcher/out/Corellia.exe
          if-no-files-found: error

  gamesettings:
    # ASI plugin: remembers the last create-game difficulty and mode. It patches two sites in
    # psobb.exe, both guarded at runtime by the exact bytes they expect to replace -- so the
    # thing CI protects here is simply that it still compiles, since nothing else builds the
    # ASI plugins at all. 32-bit, same as the client.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # The same source with logging turned up, for confirming in game that the hooks actually
      # fire and that the offsets are the ones intended. Separate OutDir/IntDir so it cannot
      # share object files with the release build and quietly become it.
      - name: Build psobb_gamesettings (diagnostic)
        run: >
          msbuild psobb_gamesettings\msvc\psobb_gamesettings.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /p:OutDir=..\bin_diag\
          /p:IntDir=..\obj_diag\
          "/p:AdditionalOptions=/DGAMESETTINGS_DIAGNOSTIC=1"
          /m /v:minimal

      - name: Build psobb_gamesettings (Release|Win32)
        # Same toolset pin as the other jobs: the runner's VS is newer than the version the
        # vcxproj selects for, so name v143 rather than falling back to an absent v141.
        run: >
          msbuild psobb_gamesettings\msvc\psobb_gamesettings.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /m /v:minimal

      # Both artifacts must exist. if-no-files-found only fires when EVERY path misses, so a
      # diagnostic build that went astray would otherwise upload silently as release-only --
      # which is how the wrong OutDir went unnoticed the first time.
      - name: Check both builds produced an .asi
        shell: pwsh
        run: |
          foreach ($p in @('psobb_gamesettings\bin\gamesettings.asi',
                           'psobb_gamesettings\bin_diag\gamesettings.asi')) {
            if (-not (Test-Path $p)) { throw "missing expected artifact: $p" }
            "{0}  {1} bytes" -f $p, (Get-Item $p).Length
          }

      - name: Show build output
        run: dir psobb_gamesettings\bin

      - name: Upload gamesettings.asi (release + diagnostic, + symbols)
        uses: actions/upload-artifact@v7
        with:
          name: gamesettings-Release-Win32
          path: |
            psobb_gamesettings/bin/gamesettings.asi
            psobb_gamesettings/bin/gamesettings.pdb
            psobb_gamesettings/bin_diag/gamesettings.asi
          if-no-files-found: error
