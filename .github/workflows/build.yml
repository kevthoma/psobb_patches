name: build

# Builds the PSOBB patches from source on a Windows runner (VS2022 + MSVC + Win10 SDK
# are preinstalled). The widescreen wrapper is 32-bit (PSOBB is x86), output d3d8.dll.
# Artifacts are downloadable from each run's summary page.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  widescreen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The .fx effects are compiled at RUNTIME by D3DX (so a bad shader only fails in-game).
      # Validate them here with fxc so HLSL errors fail the build instead. CelShader is a
      # known-good control; Sharpen is ours. (Each guards PIXEL_SIZE with an #ifndef fallback.)
      - name: Validate HLSL effects (fxc)
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction Stop |
                 Sort-Object FullName | Select-Object -Last 1
          Write-Host "fxc: $($fxc.FullName)"
          foreach ($f in @("CelShader.fx","Sharpen.fx")) {
            Write-Host "--- fxc $f ---"
            & $fxc.FullName /nologo /Tfx_2_0 "psobb_widescreen\res\$f" /Fo "$env:TEMP\$f.fxo"
            if ($LASTEXITCODE -ne 0) { throw "fxc validation failed for $f" }
          }

      # The vcxproj pins WindowsTargetPlatformVersion=7.0 (legacy) and has a post-build
      # step that copies to a local absolute path — override both for CI. D3DX9 headers/
      # libs are vendored in source/dxsdk; d3d9.h/.lib come from the runner's Win10 SDK,
      # so no DirectX SDK install is needed (DXSDK_DIR can stay empty).
      - name: Build psobb_widescreen (Release|Win32)
        # The vcxproj only selects v143 for VisualStudioVersion==17.0; the runner is now
        # VS18, so it falls back to the default v141 (not installed) -> pin the toolset here.
        run: >
          msbuild psobb_widescreen\d3d8to9.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /p:PostBuildEventUseInBuild=false
          /m /v:minimal

      - name: Show build output
        run: dir psobb_widescreen\bin\Release

      - name: Upload d3d8.dll (+ symbols)
        uses: actions/upload-artifact@v4
        with:
          name: d3d8-widescreen-Release-Win32
          path: |
            psobb_widescreen/bin/Release/d3d8.dll
            psobb_widescreen/bin/Release/d3d8.pdb
            psobb_widescreen/bin/Release/d3d8.map
          if-no-files-found: error

  launcher:
    # Corellia launcher + options app (WinForms, .NET Framework 4.8 -> no runtime install
    # for players). Writes the wrapper's widescreen.cfg; replaces the old .vbs/.ps1 launcher.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Corellia launcher (Release, net48)
        run: dotnet build corellia_launcher/CorelliaLauncher.csproj -c Release -o corellia_launcher/out

      - name: Show build output
        run: dir corellia_launcher\out

      - name: Upload Corellia.exe
        uses: actions/upload-artifact@v4
        with:
          name: Corellia-launcher
          path: corellia_launcher/out/Corellia.exe
          if-no-files-found: error
